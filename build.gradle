plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${mdg_version}"
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def resolvedModVersion = mod_version.toString().endsWith("-SNAPSHOT")
        ? mod_version.toString().replace("-SNAPSHOT", "-" + new java.text.SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date()) + "-SNAPSHOT")
        : mod_version.toString()
version = "${minecraft_version}-${resolvedModVersion}"
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Saps.dev"
        url = "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven {
        url "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
        content {
            includeGroup "com.klikli_dev"
        }
    }
    maven {
        name = "FTB"
        url = "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
}

base {
    archivesName = mod_id
}

sourceSets {
    datagen {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

tasks.named('test') { enabled = false }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    interfaceInjectionData {
        from(file("buildutil/interface_injections.json"))
    }

    mods {
        "mod" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
        "data" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.datagen)
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run-server')
        }

        gameTestServer {
            type = "gameTestServer"
            loadedMods = [ mods.mod ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neovitae.essentiaLogging', 'true'
            gameDirectory = project.file('run-gametest')
        }

        clientData {
            clientData()
            sourceSet = sourceSets.datagen
            loadedMods = [ mods.data ]
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
    runGameTestServerAdditionalRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
    runGameTestServerAdditionalRuntimeClasspath files(sourceSets.test.output)
}

dependencies {
    implementation("curse.maven:geckolib-388172:7913641")

    compileOnly("curse.maven:jade-324717:7938398")
    localRuntime("curse.maven:jade-324717:7938398")

    compileOnly ("com.klikli_dev:modonomicon-${mc_version}-neoforge:${modonomicon_version}") {transitive=false}
    localRuntime ("com.klikli_dev:modonomicon-${mc_version}-neoforge:${modonomicon_version}") {transitive=false}

    compileOnly("mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}")
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api")

    localRuntime("mezz.jei:jei-${mc_version}-neoforge:${jei_version}")
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}")

    // KubeJS - compile-only soft dependency for the optional plugin under compat/kubejs/
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

    compileOnly("dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}") {transitive=false}
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") {transitive=false}
    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}") {transitive=false}
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = version.toString().endsWith("-SNAPSHOT") ?
                "https://maven.breakinblocks.com/snapshots" :
                "https://maven.breakinblocks.com/releases"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

publishMods {
    file = jar.archiveFile
    def changelogFile = file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${version}"
    type = STABLE
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1404763"
        projectSlug = "neovitae"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        requires("geckolib", "modonomicon")
        optional("jei", "jade", "curios")
    }

    modrinth {
        projectId = "rvaW4C93"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("geckolib", "modonomicon")
        optional("jei", "jade", "curios")
    }
}

tasks.register('publishMaven') {
    description = 'Publishes the mod JAR and sources JAR to the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

tasks.register('publishMod') {
    description = 'Publishes the mod to CurseForge, Modrinth, and the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMods', 'publishMaven'
}

tasks.named('publishMods') {
    finalizedBy 'publishMaven'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
    options.compilerArgs << '-Xmaxerrs' << '5000'
    options.compilerArgs << '-Xmaxwarns' << '5000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
