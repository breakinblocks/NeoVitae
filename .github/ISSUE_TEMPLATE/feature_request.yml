name: Feature Request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Neo Vitae? Tell us about it.
  - type: checkboxes
    id: checks
    attributes:
      label: Before requesting
      options:
        - label: I searched the existing issues and this has not already been requested.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve, or what would it add?
      description: Describe the itch you are trying to scratch.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the feature
      description: What would it do, and how would it work in game?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, if any.
    validations:
      required: false
  - type: dropdown
    id: mc_version
    attributes:
      label: Which Minecraft version is this for?
      options:
        - "Both or either"
        - "26.1.2"
        - "1.21.1"
    validations:
      required: false
